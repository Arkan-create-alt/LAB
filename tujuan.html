<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deadman Switch</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.box {
    width: 90%;
    max-width: 450px;
    padding: 30px;
    background: #222;
    border-radius: 15px;
    text-align: center;
}

#timer {
    font-size: 48px;
    font-weight: bold;
    margin: 25px 0;
}

button {
    padding: 13px 25px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
}

#status {
    margin-top: 20px;
}

.sos {
    color: #ff4444;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="box">

    <h1>🟢 Deadman Switch</h1>

    <p>Check-in berikutnya sebelum:</p>

    <div id="timer">24:00:00</div>

    <button id="checkinButton" onclick="checkin()">
        🔄 CHECK-IN
    </button>

    <p id="status"></p>

</div>

<script>

// 24 JAM
const TIMEOUT = 24 * 60 * 60 * 1000;

function checkin() {

    // Reset timer menjadi 24 jam
    localStorage.setItem(
        "lastCheckin",
        Date.now()
    );

    document.getElementById("status").textContent =
        "✅ Check-in berhasil. Timer dimulai kembali 24 jam.";

    updateTimer();
}

function updateTimer() {

    const lastCheckin =
        localStorage.getItem("lastCheckin");

    if (!lastCheckin) {
        window.location.href = "index.html";
        return;
    }

    const elapsed =
        Date.now() - Number(lastCheckin);

    const remaining =
        TIMEOUT - elapsed;

    // 24 JAM SUDAH HABIS
    if (remaining <= 0) {

        document.getElementById("timer")
            .textContent = "00:00:00";

        document.getElementById("status")
            .textContent =
            "⚠️ Deadman switch on-sos";

        document.getElementById("status")
            .className = "sos";

        document.getElementById("checkinButton")
            .disabled = true;

        return;
    }

    const totalSeconds =
        Math.floor(remaining / 1000);

    const hours =
        Math.floor(totalSeconds / 3600);

    const minutes =
        Math.floor((totalSeconds % 3600) / 60);

    const seconds =
        totalSeconds % 60;

    document.getElementById("timer")
        .textContent =
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");
}

// Update setiap detik
setInterval(updateTimer, 1000);

updateTimer();

</script>

</body>
</html>
