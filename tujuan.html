<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Guru - Lab</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f3f6fa;
      color: #172b4d;
    }

    header {
      background: #172b4d;
      color: white;
      padding: 20px 30px;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .success {
      color: #15803d;
      font-size: 20px;
      font-weight: bold;
    }

    .info {
      margin-top: 15px;
      color: #6b7280;
    }
  </style>
</head>

<body>

  <header>
    <strong>Portal Guru — LAB</strong>
  </header>

  <main>
    <div class="card">
      <div class="success">Login berhasil.</div>

      <p class="info">
        Selamat datang di halaman latihan keamanan web.
      </p>

      <p class="info">
        Halaman ini hanya digunakan untuk pembelajaran dan tidak
        terhubung dengan sistem sekolah mana pun.
      </p>
    </div>
  </main>

</body>
</html>
