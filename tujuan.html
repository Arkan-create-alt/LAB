<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dead Man Switch - Login</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
    }

    .box {
        width: 90%;
        max-width: 400px;
        padding: 30px;
        background: #222;
        border-radius: 15px;
        text-align: center;
    }

    input {
        box-sizing: border-box;
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border: 0;
        border-radius: 8px;
    }

    button {
        margin-top: 10px;
        padding: 12px 25px;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
    }

    #error {
        color: #ff5555;
    }
</style>
</head>

<body>

<div class="box">
    <h1>🔐 Dead Man Switch</h1>

    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">LOGIN</button>

    <p id="error"></p>
</div>

<script>
function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (username === "Admin" && password === "Deadman switch") {

        localStorage.setItem("lastCheckin", Date.now());

        window.location.href = "tujuan.html";

    } else {
        document.getElementById("error").textContent =
            "Username atau password salah.";
    }
}
</script>

</body>
</html>
