<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAB</title>

<style>
html, body {
    margin: 0;
    min-height: 100%;
    background: white;
}

body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    font-family: Arial, sans-serif;
}

.video {
    width: min(90vw, 560px);
    aspect-ratio: 16 / 9;
}

#player {
    width: 100%;
    height: 100%;
}

#skip {
    display: none;
    padding: 14px 30px;
    border: 1px solid #111;
    border-radius: 8px;
    color: #111;
    background: white;
    text-decoration: none;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="video">
    <div id="player"></div>
</div>

<a id="skip" href="https://wa.me/">Skip</a>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
let player;

function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
        videoId: 'hB7CDrVnNCs',

        events: {
            onStateChange: function(event) {
                if (event.data === YT.PlayerState.ENDED) {
                    document.getElementById("skip").style.display = "inline-block";
                }
            }
        }
    });
}
</script>

</body>
</html>
