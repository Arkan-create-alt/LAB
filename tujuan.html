<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LAB — Tujuan</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #050505;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* GRID BACKGROUND */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(#ffffff08 1px, transparent 1px),
        linear-gradient(90deg, #ffffff08 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
}

/* CONTAINER */

.container {
    width: min(850px, 88%);
    position: relative;
    z-index: 2;
}

/* TOP */

.top {
    display: flex;
    justify-content: space-between;
    color: #555;
    font-size: 10px;
    letter-spacing: 4px;
    margin-bottom: 60px;
}

/* TITLE */

.small {
    color: #666;
    font-size: 11px;
    letter-spacing: 5px;
    margin-bottom: 25px;
}

h1 {
    font-size: clamp(55px, 12vw, 130px);
    line-height: .85;
    letter-spacing: -6px;
}

h1 span {
    color: #444;
}

/* TEXT */

.description {
    max-width: 600px;
    margin-top: 40px;
    color: #777;
    font-size: 14px;
    line-height: 1.9;
}

/* BUTTON */

.button {
    display: inline-block;
    margin-top: 45px;
    padding: 17px 28px;

    border: 1px solid #444;

    color: white;
    text-decoration: none;

    font-size: 10px;
    letter-spacing: 3px;

    transition: .3s;
}

.button:hover {
    background: white;
    color: black;
    border-color: white;
}

/* DECORATION */

.circle {
    position: fixed;
    width: 420px;
    height: 420px;
    border: 1px solid #181818;
    border-radius: 50%;
    right: -130px;
    bottom: -150px;
}

.circle::before {
    content: "";
    position: absolute;
    inset: 45px;
    border: 1px solid #181818;
    border-radius: 50%;
}

.circle::after {
    content: "";
    position: absolute;
    inset: 100px;
    border: 1px solid #181818;
    border-radius: 50%;
}

/* FOOTER */

.footer {
    position: fixed;
    bottom: 25px;
    left: 7%;

    color: #333;
    font-size: 9px;
    letter-spacing: 3px;
}

/* MOBILE */

@media(max-width:600px) {

    h1 {
        letter-spacing: -3px;
    }

    .top {
        margin-bottom: 45px;
    }

    .description {
        font-size: 13px;
    }

    .circle {
        width: 300px;
        height: 300px;
    }
}
</style>
</head>

<body>

<div class="circle"></div>

<div class="container">

    <div class="top">
        <span>LAB.SYSTEM</span>
        <span>WELCOME</span>
    </div>

    <div class="small">
        THIS IS YOUR LAB
    </div>

    <h1>
        WHY<br>
        <span>LAB?</span>
    </h1>

    <p class="description">
        LAB adalah ruang kecil untuk bereksperimen,
        belajar, dan memahami bagaimana teknologi
        bekerja di balik layar.
        <br><br>
        Jelajahi halaman ini, temukan hal baru,
        dan gunakan rasa penasaranmu untuk terus belajar.
    </p>

    <a href="index.html" class="button">
        MASUK KE MENU UTAMA →
    </a>

</div>

<div class="footer">
    SYSTEM ONLINE // 2026
</div>

</body>
</html>
