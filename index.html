<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAB</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.loader {
    text-align: center;
    width: 90%;
    max-width: 400px;
}

.logo {
    font-size: 55px;
    font-weight: bold;
    letter-spacing: 8px;
    margin-bottom: 25px;
    text-shadow: 0 0 15px #00ff88;
}

.text {
    font-size: 15px;
    color: #aaa;
    margin-bottom: 20px;
}

.bar {
    width: 100%;
    height: 8px;
    border: 1px solid #00ff88;
    border-radius: 10px;
    overflow: hidden;
}

.progress {
    height: 100%;
    width: 0%;
    background: #00ff88;
    animation: loading 3s linear forwards;
}

@keyframes loading {
    from { width: 0%; }
    to { width: 100%; }
}

.version {
    margin-top: 15px;
    font-size: 12px;
    color: #555;
}
</style>
</head>

<body>

<div class="loader">
    <div class="logo">LAB</div>

    <div class="text">
        Initializing Laboratory...
    </div>

    <div class="bar">
        <div class="progress"></div>
    </div>

    <div class="version">
        Web Security Learning Lab
    </div>
</div>

<script>
setTimeout(() => {
    window.location.href = "tujuan.html";
}, 3200);
</script>

</body>
</html>
