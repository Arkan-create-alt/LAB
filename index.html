
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b16">
<title>NEXUS GAMES | Welcome</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: #080b16;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.bg {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 50% 45%, #172554 0%, transparent 45%),
    radial-gradient(circle at 80% 20%, #30145b 0%, transparent 40%);
  animation: pulse 5s infinite alternate;
}

@keyframes pulse {
  from { opacity: .5; }
  to { opacity: 1; }
}

.container {
  position: relative;
  z-index: 2;
  width: 90%;
  max-width: 500px;
  text-align: center;
}

.logo {
  font-size: clamp(35px, 9vw, 65px);
  font-weight: 900;
  letter-spacing: 5px;
  background: linear-gradient(90deg, #60a5fa, #c084fc);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  text-shadow: 0 0 35px #6366f155;
}

.subtitle {
  margin-top: 15px;
  color: #94a3b8;
  letter-spacing: 4px;
  font-size: 12px;
}

.loader-area {
  margin: 55px auto 25px;
}

.loader {
  width: 65px;
  height: 65px;
  border: 4px solid #1e293b;
  border-top-color: #60a5fa;
  border-right-color: #c084fc;
  border-radius: 50%;
  margin: auto;
  animation: spin 1s linear infinite;
  box-shadow: 0 0 20px #6366f155;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.progress-bg {
  width: 100%;
  height: 6px;
  background: #1e293b;
  border-radius: 20px;
  margin-top: 25px;
  overflow: hidden;
}

.progress {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #3b82f6, #c084fc);
  border-radius: 20px;
  transition: width .1s linear;
}

.status {
  color: #94a3b8;
  margin-top: 15px;
  font-size: 13px;
}

.enter {
  display: none;
  margin: 35px auto 0;
  padding: 16px 50px;
  background: linear-gradient(100deg, #2563eb, #9333ea);
  color: white;
  font-weight: bold;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  letter-spacing: 3px;
  cursor: pointer;
  box-shadow: 0 0 30px #6366f155;
  transition: .3s;
}

.enter:hover {
  transform: scale(1.08);
  box-shadow: 0 0 45px #8b5cf6;
}

.footer {
  margin-top: 60px;
  color: #475569;
  font-size: 11px;
}

@media(max-width:480px) {
  .subtitle { letter-spacing: 2px; }
}
</style>
</head>

<body>
<div class="bg"></div>

<main class="container">
  <div class="logo">NEXUS</div>
  <div class="subtitle">GAMING EXPERIENCE</div>

  <div class="loader-area" id="loading">
    <div class="loader"></div>
    <div class="progress-bg">
      <div class="progress" id="progress"></div>
    </div>
    <div class="status" id="status">Initializing system... 0%</div>
  </div>

  <button class="enter" id="enter"
    onclick="location.href='tujuan.html'">
    ENTER GAME →
  </button>

  <div class="footer">
    THINK • PLAY • WIN • LEVEL UP
  </div>
</main>

<script>
let progress = 0;

const messages = [
  "Initializing system...",
  "Loading game assets...",
  "Preparing challenges...",
  "Almost ready...",
  "Welcome to Nexus!"
];

const timer = setInterval(() => {
  progress += Math.floor(Math.random() * 5) + 1;

  if (progress >= 100) {
    progress = 100;
    clearInterval(timer);

    document.getElementById("loading").style.display = "none";
    document.getElementById("enter").style.display = "block";
  }

  document.getElementById("progress").style.width = progress + "%";
  document.getElementById("status").textContent =
    messages[Math.min(4, Math.floor(progress / 25))] +
    " " + progress + "%";

}, 100);
</script>
</body>
</html>
