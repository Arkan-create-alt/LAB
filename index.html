<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deadman Switch</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.box {
    width: 90%;
    max-width: 400px;
    padding: 30px;
    background: #222;
    border-radius: 15px;
    text-align: center;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 8px 0;
    border: 0;
    border-radius: 8px;
}

button {
    padding: 12px 25px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
}

#error {
    color: #ff5555;
}
</style>
</head>

<body>

<div class="box">
    <h1>🔐 Deadman Switch</h1>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">LOGIN</button>

    <p id="error"></p>
</div>

<script>
function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    if (username === "Admin" &&
        password === "Deadman switch") {

        // Timer BARU DIMULAI saat login berhasil
        localStorage.setItem(
            "lastCheckin",
            Date.now()
        );

        localStorage.setItem(
            "loggedIn",
            "true"
        );

        window.location.href = "tujuan.html";

    } else {

        document.getElementById("error").textContent =
            "Username atau password salah.";
    }
}
</script>

</body>
</html>
