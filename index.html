<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Guru - Lab</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f6fa;
    }

    .login-box {
      width: 380px;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      color: #172b4d;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 600;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #error {
      display: none;
      margin-top: 15px;
      padding: 11px;
      border-radius: 6px;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 14px;
    }

    .lab {
      margin-top: 22px;
      text-align: center;
      color: #9ca3af;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>Portal Guru</h1>
    <div class="subtitle">Silakan masuk ke akun Anda</div>

    <form id="loginForm">
      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="text"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Masuk</button>

      <div id="error">Email atau password salah.</div>
    </form>

    <div class="lab">
      EDUCATIONAL LOGIN LAB
    </div>
  </div>

  <script>
    /*
      DUMMY CREDENTIAL UNTUK LAB.
      Ini BUKAN sistem autentikasi sungguhan.
    */
    const LAB_EMAIL = "admin";
    const LAB_PASSWORD = "admin123";

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const error = document.getElementById("error");

      if (email === LAB_EMAIL && password === LAB_PASSWORD) {
        window.location.href = "tujuan.html";
      } else {
        error.style.display = "block";
      }
    });
  </script>

</body>
</html>
